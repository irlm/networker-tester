# Lab UI: serves the built React SPA and proxies /api + /ws to the control
# plane — same shape as the prod nginx site install.sh writes
# (step_setup_nginx_proxy), minus TLS/ACME. In prod, agents ALSO reach the
# control plane through nginx (wss://laghound.com/ws/agent); `lab.sh up
# --agents-via-ui` points runners at ws://ui/ws/agent so the proxied WebSocket
# path (Upgrade headers, X-Real-IP, 86400s read timeout) is exercised too.
server {
    listen 80;
    server_name _;

    location / {
        root /usr/share/nginx/html;
        try_files $uri $uri/ /index.html;
    }

    location /api/ {
        proxy_pass http://controlplane:5030;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 300;
    }

    location /ws/ {
        proxy_pass http://controlplane:5030;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_read_timeout 86400;
    }
}
