services:
  postgres:
    # Plain PostgreSQL 16, matching production byte for byte.
    # This was timescale/timescaledb-ha until 2026-08-24. Prod runs a stock
    # Ubuntu postgresql-16 with NO timescaledb (not installed, not even
    # available), and so do the lab, the SQL-test compose file and the C#
    # Testcontainers suites — this dev database was the ONLY environment with
    # the extension. Developing against a richer engine than you deploy to is
    # how `time_bucket` nearly shipped into the URL comparison report: it would
    # have worked on every developer machine and thrown in production.
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: networker_core
      POSTGRES_USER: networker
      POSTGRES_PASSWORD: networker
    ports:
      # Host port is configurable: scripts/dev-setup.sh picks a free one into
      # .dev.env when 5432 is already taken by a local PostgreSQL.
      - "${DEV_PG_PORT:-5432}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./scripts/init-logs-db.sql:/docker-entrypoint-initdb.d/01-logs-db.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U networker -d networker_core"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  pgdata:
