name: CI

# A newer push to the same PR cancels that PR's previous run: the self-hosted
# CI hosts are a small pool and a superseded run must not hold them (the
# first real day stacked eight workflows per push). Pushes to main and
# dispatches never cancel — auto-tag/release depend on them finishing.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

on:
  push:
    branches: ["main", "develop"]
  pull_request:
    branches: ["main"]

permissions:
  contents: write
  actions: write
  # auto-tag verifies the merged PR's required checks by querying
  # repository.pullRequest over GraphQL. On a PRIVATE repo the default token
  # cannot read that without pull-requests:read -- it fails with "Resource not
  # accessible by integration", the guard exits 1, and NOTHING gets tagged or
  # deployed. While the repo was public the same query needed no scope.
  pull-requests: read
  # ...and the check-runs REST call right after it
  # (repos/{repo}/commits/{sha}/check-runs, ci.yml ~L1082) needs checks:read on
  # a private repo. Granting only pull-requests:read moved the 403 one line
  # down rather than fixing it.
  checks: read

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  # ──────────────────────────────────────────────────────────────────────────
  # Changed-area detection: lets C#-only / frontend-only PRs skip the Rust
  # matrix (job-level skips still satisfy branch-protection required checks,
  # unlike workflow-level `paths:` filters which leave them missing).
  #
  # PUSH EVENTS ALWAYS RUN EVERYTHING — the main-branch matrix feeds coverage
  # and the soak record. auto-tag no longer WAITS for it (branch protection
  # already proved the PR green; auto-tag re-verifies that on the merged PR's
  # head instead of re-running ~8 min of tests), but a C#-only version bump
  # must still release. Only pull_request events skip. Detection is
  # conservative: Rust runs unless EVERY changed file matches a known
  # non-Rust pattern.
  #
  # This job also picks where every other job runs (a self-hosted CI host
  # when one is online, GitHub-hosted otherwise — docs/self-hosted-ci.md); it stays
  # on ubuntu-latest itself because it is the hop that decides.
  # ──────────────────────────────────────────────────────────────────────────
  changes:
    name: Detect changed areas
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      rust: ${{ steps.detect.outputs.rust }}
      frontend: ${{ steps.detect.outputs.frontend }}
      orchestrator: ${{ steps.detect.outputs.orchestrator }}
      # Where the rest of this workflow runs (docs/self-hosted-ci.md).
      # This job itself stays on ubuntu-latest: it is the hop that decides.
      linux_host: ${{ steps.ci_hosts.outputs.linux }}
      # For jobs that need a real machine (systemd / tc netem) — a
      # containerised CI host has neither. See pick-ci-hosts.
      linux_bare_host: ${{ steps.ci_hosts.outputs.linux_bare }}
      windows_host: ${{ steps.ci_hosts.outputs.windows }}
      macos_host: ${{ steps.ci_hosts.outputs.macos }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v5
        with:
          fetch-depth: 0

      - name: Pick CI hosts (self-hosted when online, else GitHub-hosted)
        id: ci_hosts
        uses: ./.github/actions/pick-ci-hosts
        with:
          token: ${{ secrets.CI_HOSTS_STATUS_TOKEN }}
          mode: ${{ vars.CI_HOSTS_MODE }}

      - name: Detect
        id: detect
        run: |
          if [ "${{ github.event_name }}" != "pull_request" ]; then
            echo "rust=true" >> "$GITHUB_OUTPUT"
            echo "frontend=true" >> "$GITHUB_OUTPUT"
            echo "orchestrator=true" >> "$GITHUB_OUTPUT"
            echo "push event — running everything"
            exit 0
          fi
          git fetch origin "${{ github.base_ref }}" --quiet
          # Version-bump-only edits to the five bump files are filtered out —
          # otherwise the mandatory per-PR bump makes every path filter true
          # and every PR pays for every suite (see scripts/ci/).
          CHANGED=$(scripts/ci/effective-changed-files.sh "origin/${{ github.base_ref }}")
          echo "changed files:"; echo "$CHANGED" | sed 's/^/  /'

          # Rust is SKIPPED only when EVERY changed file is provably non-Rust:
          # C# solution (src/), C# tests, frontend, docs, markdown, or the
          # C#-workflow file. Any other file (crates/, Cargo.*, installers,
          # scripts, this workflow, ...) keeps the full matrix. Deliberately
          # avoids `grep -qv` (selected-vs-matched semantics differ between
          # GNU and BSD grep) — capture the non-safe lines and test non-empty.
          RUST=false
          NON_SAFE=$(echo "$CHANGED" | grep -vE '^(src/|tests/Networker\.|dashboard/|docs/|\.github/workflows/dotnet\.yml$)|\.md$' || true)
          if [ -n "$NON_SAFE" ]; then
            RUST=true
            echo "rust-relevant files:"; echo "$NON_SAFE" | sed 's/^/  /'
          fi

          # Frontend runs iff dashboard/ changed (or push, handled above) —
          # OR the control plane's endpoints changed. The frontend suite now
          # carries the route-contract guard (audit P1-12), which checks the
          # api client's URLs against the routes the C# control plane actually
          # registers. Route drift usually originates on the SERVER side, so
          # gating that guard on dashboard/ alone would let exactly the change
          # it exists to catch skip it.
          FRONTEND=false
          if echo "$CHANGED" | grep -qE '^(dashboard/|src/Networker\.ControlPlane/)'; then
            FRONTEND=true
          fi

          # Orchestrator (alethabench) is workspace-excluded, so the main lint
          # job never sees it — run its own lint/test iff its tree changed.
          ORCHESTRATOR=false
          if echo "$CHANGED" | grep -qE '^benchmarks/orchestrator/'; then
            ORCHESTRATOR=true
          fi

          echo "rust=$RUST" >> "$GITHUB_OUTPUT"
          echo "frontend=$FRONTEND" >> "$GITHUB_OUTPUT"
          echo "orchestrator=$ORCHESTRATOR" >> "$GITHUB_OUTPUT"
          echo "rust=$RUST frontend=$FRONTEND orchestrator=$ORCHESTRATOR"

  # ──────────────────────────────────────────────────────────────────────────
  # Version bump check: every PR must bump Cargo.toml version + CHANGELOG
  # ──────────────────────────────────────────────────────────────────────────
  version-check:
    name: Version bump check
    runs-on: ${{ fromJSON(needs.changes.outputs.linux_host) }}
    timeout-minutes: 10
    needs: [changes]
    if: github.event_name == 'pull_request'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v5
        with:
          fetch-depth: 0

      - name: Check version bump and changelog
        run: |
          git fetch origin main --quiet

          # A version bump is only required when a PR changes something that
          # actually SHIPS to users: the Rust crates, the frontend, the
          # installers, or the lockfile/manifest. PRs that touch only the C#
          # solution (src/, tests/Networker.Tests/), CI, or docs don't ride the
          # Rust release train, so forcing a bump on them is noise. Require the
          # bump iff a shipping artifact changed.
          # Dependabot PRs are dependency-only: requiring a manual version bump
          # on each would defeat the automation. Their lockfile/manifest changes
          # ride into the NEXT bumped release (release builds are --locked
          # against the merged lockfile), so exempt them here.
          # PR AUTHOR, not github.actor: the actor of a synchronize event is
          # whoever pushed/refreshed the branch (e.g. a maintainer running
          # update-branch), which broke the exemption on first use.
          if [ "${{ github.event.pull_request.user.login }}" = "dependabot[bot]" ]; then
            echo "✓ Dependabot PR — dependency-only; changes ride the next release. Bump not required."
            exit 0
          fi

          # Frontend TEST files (*.test.* / *.spec.*) live under dashboard/ but
          # are not bundled into the shipped SPA, so a test-only frontend PR must
          # not force a release. Exclude them from the shipping match.
          SHIPPING=$(git diff --name-only origin/main...HEAD \
            | grep -E '^(crates/|src/|dashboard/|install\.sh$|install\.ps1$|Cargo\.(toml|lock)$|Directory\.Build\.props$)' \
            | grep -vE '^(dashboard/.*\.(test|spec)\.[jt]sx?|src/.*\.md)$' || true)
          if [ -z "${SHIPPING}" ]; then
            echo "✓ PR changes no shipping artifacts (crates/frontend/installers) — Rust version bump not required."
            exit 0
          fi

          # Get version from PR branch
          PR_VERSION=$(grep '^version' Cargo.toml | head -1 | sed 's/.*"\(.*\)"/\1/')

          # Get version from base branch
          BASE_VERSION=$(git show origin/main:Cargo.toml | grep '^version' | head -1 | sed 's/.*"\(.*\)"/\1/')

          echo "Base version: ${BASE_VERSION}"
          echo "PR version:   ${PR_VERSION}"

          if [ "${PR_VERSION}" = "${BASE_VERSION}" ]; then
            echo "::error::Version not bumped. Every PR must bump the version in Cargo.toml (patch for fixes, minor for features)."
            echo ""
            echo "Current version: ${BASE_VERSION}"
            echo "Bump to at least: $(echo ${BASE_VERSION} | awk -F. '{print $1"."$2"."$3+1}')"
            echo ""
            echo "Also update: CHANGELOG.md, install.sh (INSTALLER_VERSION), install.ps1 (InstallerVersion), Directory.Build.props (<Version>)"
            exit 1
          fi

          # Check CHANGELOG has entry for new version
          if ! grep -q "## \[${PR_VERSION}\]" CHANGELOG.md; then
            echo "::error::CHANGELOG.md missing entry for version ${PR_VERSION}. Add a ## [${PR_VERSION}] section."
            exit 1
          fi

          # Check installer versions match
          INSTALL_SH_VER=$(grep 'INSTALLER_VERSION=' install.sh | head -1 | sed 's/.*"v\(.*\)".*/\1/')
          INSTALL_PS_VER=$(grep 'InstallerVersion' install.ps1 | head -1 | sed 's/.*"v\(.*\)".*/\1/')

          if [ "${INSTALL_SH_VER}" != "${PR_VERSION}" ]; then
            echo "::error::install.sh INSTALLER_VERSION (${INSTALL_SH_VER}) doesn't match Cargo.toml (${PR_VERSION})"
            exit 1
          fi
          if [ "${INSTALL_PS_VER}" != "${PR_VERSION}" ]; then
            echo "::error::install.ps1 InstallerVersion (${INSTALL_PS_VER}) doesn't match Cargo.toml (${PR_VERSION})"
            exit 1
          fi

          # Check Directory.Build.props (the single C# version source) matches —
          # keeps the Rust and C# halves of the hybrid from drifting. Every C#
          # runtime-reported version (agent heartbeat, endpoint ServerInfo,
          # control-plane /api/health + /api/version) derives from this at
          # build time, so this one line IS the C# version.
          PROPS_VER=$(grep -o '<Version>[^<]*</Version>' Directory.Build.props | head -1 | sed 's/<[^>]*>//g')
          if [ "${PROPS_VER}" != "${PR_VERSION}" ]; then
            echo "::error::Directory.Build.props <Version> (${PROPS_VER}) doesn't match Cargo.toml (${PR_VERSION})."
            echo ""
            echo "The COMPLETE version-bump list is exactly 5 files:"
            echo "  1. Cargo.toml            (workspace version)"
            echo "  2. CHANGELOG.md          (new ## [X.Y.Z] section)"
            echo "  3. install.sh            (INSTALLER_VERSION)"
            echo "  4. install.ps1           (InstallerVersion)"
            echo "  5. Directory.Build.props (<Version> — all C# assemblies)"
            echo ""
            echo "Everything else is derived: C# assemblies, /api/health, /api/version,"
            echo "agent heartbeats, and endpoint ServerInfo all read the assembly version."
            exit 1
          fi

          echo "✓ Version bumped: ${BASE_VERSION} → ${PR_VERSION}"
          echo "✓ CHANGELOG entry found"
          echo "✓ Installer versions match"
          echo "✓ Directory.Build.props (C# assemblies) matches"

  # ──────────────────────────────────────────────────────────────────────────
  # Fast checks: format + clippy (fails early, < 2 min)
  # ──────────────────────────────────────────────────────────────────────────
  # ── Supply chain: every action must be SHA-pinned ─────────────────────────
  # A mutable tag (`@v4`) lets whoever can move that tag run arbitrary code in
  # CI with this repo's secrets. The convention here is SHA pins, but it was
  # only a convention: soak-canary.yml sat on `actions/checkout@v4` while the
  # other 44 call sites were pinned, and nothing noticed. No `if:` guard — a
  # workflow-only change must not be able to skip this.
  action-pins:
    name: Action pins (SHA-pinned)
    runs-on: ${{ fromJSON(needs.changes.outputs.linux_host) }}
    timeout-minutes: 10
    needs: [changes]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v5

      # The check lives in scripts/lint-all.sh (section action-pins) so the
      # local pre-push pass and CI run the same grep + guard-the-guard floor.
      - name: Every `uses:` must reference a 40-char commit SHA
        run: scripts/lint-all.sh --ci --only action-pins

  # ──────────────────────────────────────────────────────────────────────────
  # Cross-cutting lints that no per-area job owns: workflow structure
  # (actionlint), JSON syntax of the shared/config tables, and the five
  # version files agreeing with each other. Cheap, toolchain-free (actionlint
  # runs from its pinned image), ungated. Same script as the local
  # `scripts/lint-all.sh`; promote an `info` section to `block` there and
  # this job enforces it automatically.
  # ──────────────────────────────────────────────────────────────────────────
  lint-all:
    name: lint-all (cross-cutting)
    runs-on: ${{ fromJSON(needs.changes.outputs.linux_host) }}
    timeout-minutes: 15
    needs: [changes]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v5

      - name: json / version-sync / workflows
        env:
          LINT_DOCKER: "1"
        run: scripts/lint-all.sh --ci --only json,version,workflows

      # sdk-js is a `block` section that nothing in CI ran: the frontend job
      # only invokes frontend-eslint and is gated on dashboard/ changes, and
      # sdk-conformance builds and tests sdk/js without type-checking it. The
      # section was failing on pristine main (12 TS18046/TS2571) with nobody
      # to see it. A baseline that only runs on some paths is not a baseline —
      # so it runs here, unconditionally, like json/version/workflows.
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: sdk/js/package-lock.json

      - name: sdk/js dependencies (no postinstall scripts)
        working-directory: sdk/js
        run: npm ci --ignore-scripts

      - name: sdk/js type check
        run: scripts/lint-all.sh --ci --only sdk-js

  lint:
    name: Lint
    runs-on: ${{ fromJSON(needs.changes.outputs.linux_host) }}
    timeout-minutes: 20
    needs: [changes]
    # C#-only / frontend-only / docs-only PRs skip the Rust matrix entirely;
    # every job that `needs: lint` (tests, coverage, sql/pg) cascades the skip.
    # Push events always run (coverage + the main-branch soak record).
    if: needs.changes.outputs.rust == 'true'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v5
      - uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # stable
        with:
          components: rustfmt, clippy

      # GitHub-hosted only: a CI host keeps CARGO_HOME on local disk between
      # jobs (it is outside the workspace the loop wipes), so restoring the
      # same registry over a home uplink is pure cost. sccache covers the
      # compilation-unit cache there.
      - name: Cache cargo
        if: runner.environment == 'github-hosted'
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.1
        with:
          key: lint
          cache-on-failure: "true"

      # The four Rust lints (fmt --check, clippy -D warnings, the
      # no-default-features stub build, and the rustdoc lint that fails on
      # broken intra-doc links / bare URLs / malformed HTML in doc comments)
      # are defined ONCE in scripts/lint-all.sh — the same sections a
      # developer runs locally before pushing. Edit the commands there.
      - name: Check formatting
        run: scripts/lint-all.sh --ci --only rust-fmt

      - name: Clippy (default features)
        run: scripts/lint-all.sh --ci --only rust-clippy

      - name: Build without default features (stub paths)
        run: scripts/lint-all.sh --ci --only rust-nodefault

      - name: Rustdoc lint (broken links / bare URLs / bad HTML)
        run: scripts/lint-all.sh --ci --only rust-doc

  # ──────────────────────────────────────────────────────────────────────────
  # musl type-check: the RELEASE builds target x86_64-unknown-linux-musl, whose
  # libc types differ from the glibc the test jobs run against (e.g. msghdr's
  # msg_controllen is usize on glibc but u32 on musl — exactly what broke the
  # v0.28.76 release AFTER merge). This job catches that class at PR time.
  # cargo check is enough: it type-checks against musl's libc definitions.
  # ──────────────────────────────────────────────────────────────────────────
  musl-check:
    name: musl check (release target types)
    runs-on: ${{ fromJSON(needs.changes.outputs.linux_host) }}
    needs: [changes]
    if: needs.changes.outputs.rust == 'true'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v5
      - uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # stable
        with:
          targets: x86_64-unknown-linux-musl

      # GitHub-hosted only: a CI host keeps CARGO_HOME on local disk between
      # jobs (it is outside the workspace the loop wipes), so restoring the
      # same registry over a home uplink is pure cost. sccache covers the
      # compilation-unit cache there.
      - name: Cache cargo
        if: runner.environment == 'github-hosted'
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.1
        with:
          key: musl-check
          cache-on-failure: "true"

      - name: Install musl tools (ring/aws-lc build scripts)
        timeout-minutes: 10
        run: |
          # Unbounded apt hung a runner for 110 minutes on 2026-08-19 (same
          # failure shape as the Playwright CDN stall fixed the same day):
          # bound each attempt and retry so a stall fails fast instead of
          # eating the job's 6h budget.
          for attempt in 1 2 3; do
            if timeout 180 sudo apt-get update -qq \
               && timeout 180 sudo apt-get install -y musl-tools; then
              exit 0
            fi
            echo "::warning::apt musl-tools attempt ${attempt} failed or stalled; retrying"
            sleep 5
          done
          echo "::error::apt musl-tools failed after 3 bounded attempts"
          exit 1

      # The shipped-to-prod set (what release.yml's build-linux compiles).
      - name: Check shipped crates against musl
        run: cargo check -p networker-tester -p networker-endpoint --target x86_64-unknown-linux-musl

  # ──────────────────────────────────────────────────────────────────────────
  # Supply-chain provenance gate (cargo-vet). The current dependency tree is
  # baselined as exemptions in supply-chain/config.toml, so this passes today;
  # any NEW or bumped crate (e.g. a Dependabot cargo PR) that is not covered by
  # a trusted upstream audit set (Mozilla/Google/Bytecode-Alliance, imported in
  # config.toml + pinned in imports.lock) FAILS here — forcing a human
  # provenance review before the code can enter CI/prod. `--locked` uses the
  # committed imports.lock, so this does not re-fetch audit sets at run time.
  # cargo audit catches KNOWN advisories; cargo-vet gates UNVETTED code.
  # ──────────────────────────────────────────────────────────────────────────
  cargo-vet:
    name: cargo-vet (supply-chain provenance)
    runs-on: ${{ fromJSON(needs.changes.outputs.linux_host) }}
    timeout-minutes: 15
    needs: [changes]
    if: needs.changes.outputs.rust == 'true'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v5
      - uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # stable
      # GitHub-hosted only: a CI host keeps CARGO_HOME on local disk between
      # jobs (it is outside the workspace the loop wipes), so restoring the
      # same registry over a home uplink is pure cost. sccache covers the
      # compilation-unit cache there.
      - name: Cache cargo
        if: runner.environment == 'github-hosted'
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.1
        with:
          key: cargo-vet
          cache-on-failure: "true"
      # A self-hosted CI host keeps CARGO_HOME between jobs, so a cargo-vet that
      # an earlier run left behind at a DIFFERENT version makes a plain
      # `cargo install` fail outright — "error: binary `cargo-vet` already
      # exists in destination" — and took main red on 2026-08-24. A hosted
      # runner never hits it because its CARGO_HOME is new every time.
      # Install only when the pinned version is not already there (fast on a
      # warm host), and --force past a stale one instead of failing on it.
      - name: Install cargo-vet
        run: |
          want=0.10.2
          if cargo-vet --version 2>/dev/null | grep -qw "$want"; then
            echo "cargo-vet $want already present"
          else
            cargo install cargo-vet --locked --version "$want" --force
          fi
      - name: Vet dependencies (main workspace)
        run: cargo vet --locked

  # ──────────────────────────────────────────────────────────────────────────
  # Benchmark orchestrator (alethabench): workspace-excluded, so the lint job
  # above never touches it. Guards the clippy debt cleared in #441 (53→0).
  # Gated like the other areas: PRs run it only when benchmarks/orchestrator/**
  # changed; push events always run (changes sets orchestrator=true on push).
  # NOT a branch-protection required check — job-level skip is fine.
  # ──────────────────────────────────────────────────────────────────────────
  orchestrator:
    name: Orchestrator lint & test
    runs-on: ${{ fromJSON(needs.changes.outputs.linux_host) }}
    timeout-minutes: 20
    needs: [changes]
    if: needs.changes.outputs.orchestrator == 'true'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v5
      - uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # stable
        with:
          components: clippy

      # GitHub-hosted only: a CI host keeps CARGO_HOME on local disk between
      # jobs (it is outside the workspace the loop wipes), so restoring the
      # same registry over a home uplink is pure cost. sccache covers the
      # compilation-unit cache there.
      - name: Cache cargo
        if: runner.environment == 'github-hosted'
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.1
        with:
          key: orchestrator
          workspaces: benchmarks/orchestrator
          cache-on-failure: "true"

      - name: Clippy (deny warnings)
        run: cargo clippy --manifest-path benchmarks/orchestrator/Cargo.toml --all-targets -- -D warnings

      - name: Tests
        run: cargo test --manifest-path benchmarks/orchestrator/Cargo.toml

  # ──────────────────────────────────────────────────────────────────────────
  # Ubuntu tests: full feature set including browser
  # ──────────────────────────────────────────────────────────────────────────
  test-ubuntu:
    name: Test (ubuntu-latest)
    runs-on: ${{ fromJSON(needs.changes.outputs.linux_host) }}
    timeout-minutes: 30
    needs: [changes, lint]  # skip if lint fails

    env:
      CARGO_INCREMENTAL: "0"
      CARGO_PROFILE_DEV_DEBUG: "0"
      CARGO_PROFILE_TEST_DEBUG: "0"
      # sccache caches individual compilation units keyed on their own input
      # hash, so it survives a Cargo.lock bump — only the crates that actually
      # changed recompile. This is what speeds up the COLD path (every shippable
      # PR bumps the version, busting Swatinem's lockfile-keyed target cache).
      # CARGO_INCREMENTAL=0 above is mandatory: sccache can't cache incremental.
      RUSTC_WRAPPER: sccache
      SCCACHE_GHA_ENABLED: "true"

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v5

      - uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # stable

      - name: Set up sccache
        uses: mozilla-actions/sccache-action@fc920bf0ec8de6ee65d409111f7ec508035751ba # v0.0.11

      # On a CI host, the GitHub Actions cache backend is on the far side of a
      # home broadband link: every hit is a download, which is why musl still
      # took 4-6 min there. /var/cache/ci-host survives the per-job workspace
      # wipe, so point sccache at local disk instead and restart the server so
      # it picks the new backend up (the action starts it with GHA settings).
      - name: sccache on local disk (self-hosted only)
        if: runner.environment == 'self-hosted'
        shell: bash
        run: |
          dir=/var/cache/ci-host/sccache
          mkdir -p "$dir" || { echo "::warning::cannot create $dir — leaving sccache on the GHA backend"; exit 0; }
          sccache --stop-server >/dev/null 2>&1 || true
          {
            echo "SCCACHE_GHA_ENABLED=false"
            echo "SCCACHE_DIR=$dir"
            echo "SCCACHE_CACHE_SIZE=20G"
          } >> "$GITHUB_ENV"

      # Swatinem still handles the warm path (registry + a lockfile-keyed target
      # restore); sccache layers under it for the cold path.
      # GitHub-hosted only: a CI host keeps CARGO_HOME on local disk between
      # jobs (it is outside the workspace the loop wipes), so restoring the
      # same registry over a home uplink is pure cost. sccache covers the
      # compilation-unit cache there.
      - name: Cache cargo
        if: runner.environment == 'github-hosted'
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.1
        with:
          key: ubuntu-test
          cache-on-failure: "true"

      # Scope to the crates that still ship as Rust — the probe core (tester)
      # and the diagnostic server (endpoint). networker-dashboard/-agent were
      # replaced by the C# control plane (tested in dotnet.yml) and are pending
      # decommission, so they're off the Rust test matrix. The `lint` job still
      # clippy-builds the WHOLE workspace, a soak-time compile check for the
      # retiring crates (rollback confidence).
      - name: Tester unit tests
        run: cargo test -p networker-tester --lib

      - name: Endpoint unit tests
        run: cargo test -p networker-endpoint --lib

      # Parallel since v0.28.169: every test allocates its own ports and the
      # readiness gates wait on positive signals (v0.28.164-167), so the old
      # serialization is obsolete. Measured locally: 45/45 in ~5s vs ~20s
      # serialized, across repeated runs. Windows stays --test-threads=1 until
      # the QUIC-gate fix has a longer green history — do not "tidy" that one
      # to match without checking the flake record first.
      - name: Integration tests
        run: cargo test --test integration -p networker-tester

      - name: sccache stats
        if: always()
        run: sccache --show-stats

  # ──────────────────────────────────────────────────────────────────────────
  # Windows tests: skip browser feature (no Chrome, saves ~10 min compile)
  # ──────────────────────────────────────────────────────────────────────────
  test-windows:
    name: Test (windows-latest)
    runs-on: ${{ fromJSON(needs.changes.outputs.windows_host) }}
    timeout-minutes: 45
    needs: [changes, lint]  # skip if lint fails

    # Windows is the CI long-pole. Three knobs cut it hard:
    #  - CARGO_INCREMENTAL=0: incremental compilation is dead weight in CI
    #    (cold or cache-restored builds never reuse it) and is required by
    #    sccache, which can't cache incremental artifacts.
    #  - *_DEBUG=0: skip DWARF/PDB debuginfo generation, which is a large slice
    #    of Windows codegen+link time. RUST_BACKTRACE still yields function
    #    names; only line numbers are lost — an acceptable CI trade.
    #  - sccache: per-compilation-unit cache that survives Cargo.lock bumps, so
    #    the COLD path (every shippable PR bumps the version) only recompiles
    #    the crates that actually changed rather than the whole graph.
    env:
      CARGO_INCREMENTAL: "0"
      CARGO_PROFILE_DEV_DEBUG: "0"
      CARGO_PROFILE_TEST_DEBUG: "0"
      RUSTC_WRAPPER: sccache
      SCCACHE_GHA_ENABLED: "true"

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v5

      - uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # stable

      - name: Set up sccache
        uses: mozilla-actions/sccache-action@fc920bf0ec8de6ee65d409111f7ec508035751ba # v0.0.11

      # On a CI host, the GitHub Actions cache backend is on the far side of a
      # home broadband link: every hit is a download, which is why musl still
      # took 4-6 min there. /var/cache/ci-host survives the per-job workspace
      # wipe, so point sccache at local disk instead and restart the server so
      # it picks the new backend up (the action starts it with GHA settings).
      - name: sccache on local disk (self-hosted only)
        if: runner.environment == 'self-hosted'
        shell: bash
        run: |
          dir=/var/cache/ci-host/sccache
          mkdir -p "$dir" || { echo "::warning::cannot create $dir — leaving sccache on the GHA backend"; exit 0; }
          sccache --stop-server >/dev/null 2>&1 || true
          {
            echo "SCCACHE_GHA_ENABLED=false"
            echo "SCCACHE_DIR=$dir"
            echo "SCCACHE_CACHE_SIZE=20G"
          } >> "$GITHUB_ENV"

      # Swatinem/rust-cache caches a pruned target/ (deps only) + registry,
      # keyed on lockfile+rustc+job — the warm path when the lockfile matches.
      # sccache (above) layers under it to accelerate the cold path.
      # GitHub-hosted only: a CI host keeps CARGO_HOME on local disk between
      # jobs (it is outside the workspace the loop wipes), so restoring the
      # same registry over a home uplink is pure cost. sccache covers the
      # compilation-unit cache there.
      - name: Cache cargo
        if: runner.environment == 'github-hosted'
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.1
        with:
          key: windows-test
          cache-on-failure: "true"

      # Build without browser feature (chromiumoxide adds ~10 min on Windows,
      # and there's no Chrome in the CI runner to test with anyway).
      # All other features (http3, db-mssql) are included via defaults.
      # Shipped Rust crates only (see the ubuntu job) — dashboard/agent are C#.
      - name: Tester unit tests (no browser)
        run: cargo test -p networker-tester --lib --no-default-features --features http3,db-mssql

      - name: Endpoint unit tests
        run: cargo test -p networker-endpoint --lib

      - name: Integration tests
        run: cargo test --test integration -p networker-tester --no-default-features --features http3 -- --test-threads=1

      - name: sccache stats
        if: always()
        run: sccache --show-stats

  # ──────────────────────────────────────────────────────────────────────────
  # macOS unit tests: the primary DEV platform, but until now compiled only at
  # release-tag time — every #[cfg(target_os = "macos")] block (host_statistics
  # CPU ticks, TCP_CONNECTION_INFO socket info, en0 capture default, IP_DONTFRAG
  # pmtud) and its macOS-gated tests ran nowhere in CI. Lib tests only (no
  # browser feature — no Chrome on the runner; no integration suite — the
  # ubuntu/windows jobs own that). Not a required check.
  # ──────────────────────────────────────────────────────────────────────────
  test-macos:
    name: Test (macos-latest)
    runs-on: ${{ fromJSON(needs.changes.outputs.macos_host) }}
    timeout-minutes: 30
    needs: [changes, lint]
    env:
      CARGO_INCREMENTAL: "0"
      CARGO_PROFILE_DEV_DEBUG: "0"
      CARGO_PROFILE_TEST_DEBUG: "0"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v5
      - uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # stable
      # GitHub-hosted only: a CI host keeps CARGO_HOME on local disk between
      # jobs (it is outside the workspace the loop wipes), so restoring the
      # same registry over a home uplink is pure cost. sccache covers the
      # compilation-unit cache there.
      - name: Cache cargo
        if: runner.environment == 'github-hosted'
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.1
        with:
          key: macos-test
          cache-on-failure: "true"
      - name: Tester unit tests (no browser)
        run: cargo test -p networker-tester --lib --no-default-features --features http3,db-mssql
      - name: Endpoint + log unit tests
        run: cargo test -p networker-endpoint -p networker-log --lib

  # ──────────────────────────────────────────────────────────────────────────
  # Dashboard frontend
  # ──────────────────────────────────────────────────────────────────────────
  frontend:
    name: Dashboard frontend
    runs-on: ${{ fromJSON(needs.changes.outputs.linux_host) }}
    needs: [lint, changes]
    # Runs iff dashboard/ changed (push events set frontend=true). `!cancelled()`
    # + explicit lint-result check keeps it runnable when lint is SKIPPED
    # (frontend-only PR) while still failing fast when lint actually FAILS.
    if: ${{ !cancelled() && needs.changes.outputs.frontend == 'true' && (needs.lint.result == 'success' || needs.lint.result == 'skipped') }}
    defaults:
      run:
        working-directory: dashboard

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v5

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: dashboard/package-lock.json

      - name: Install dependencies (no postinstall scripts)
        run: npm ci --ignore-scripts

      # ESLint was local-only (test-all.sh) until lint-all landed — a lint
      # regression in dashboard/ could merge with green CI. Same section a
      # developer runs via `scripts/lint-all.sh --only frontend`.
      - name: ESLint
        working-directory: .
        run: scripts/lint-all.sh --ci --only frontend-eslint

      # Blocking audit covers PRODUCTION dependencies only (--omit=dev): a
      # dev-tooling advisory (eslint/vitest transitives) cannot reach the
      # shipped bundle and must not block releases — 2026-07-27's
      # brace-expansion DoS (GHSA-mh99-v99m-4gvg) had no non-breaking fix for
      # the eslint chain and stalled the release train, exactly like the
      # 07-24 react-router advisory before the v8 migration. Dev-dep findings
      # still surface in the non-blocking full audit below.
      - name: Audit for known vulnerabilities (prod deps, blocking)
        run: npm audit --audit-level=high --omit=dev

      - name: Full audit incl. dev deps (informational)
        run: npm audit --audit-level=high || echo "::warning::dev-dependency advisories present (non-blocking) — review npm audit output above"

      - run: npm test
      - run: npm run build
      # Audit P1-11: the bundle budget is enforced, not merely warned about
      # (vite's chunkSizeWarningLimit has never failed a build).
      - run: npm run check:bundle-size

      # ── Audit P2: browser E2E on the PRODUCTION BUILD ──────────────────────
      # Every other frontend test mocks ../api/client, so none of them ever
      # loads the built bundle. A lazy chunk that 404s only in prod, a router
      # misconfiguration, or a hook that throws during the real mount all pass
      # jsdom and fail the user. Playwright drives `vite preview` serving dist/
      # with the API intercepted at the network layer.
      #
      # Chromium only, and --with-deps because the runner lacks the shared
      # libraries the browser needs. npm's cache does not cover browsers, so
      # the browser binaries are cached separately, keyed on the installed
      # @playwright/test version. Without the timeout+retry the CDN download
      # can stall FOREVER and hang the job until the 6h runner kill — it did
      # exactly that twice in a row on 2026-08-19 (103 min + 94 min, PR #813).
      - name: Resolve Playwright version
        id: playwright-version
        run: echo "version=$(node -p "require('@playwright/test/package.json').version")" >> "$GITHUB_OUTPUT"

      - name: Cache Playwright browsers
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v5
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ steps.playwright-version.outputs.version }}

      - name: Install Chromium for Playwright
        timeout-minutes: 15
        run: |
          # `timeout 240` bounds a single stalled download; three attempts
          # cover transient CDN failures. install-deps is apt against the
          # runner image and is retried with the same bound.
          for attempt in 1 2 3; do
            if timeout 240 npx playwright install chromium --with-deps; then
              exit 0
            fi
            echo "::warning::playwright install attempt ${attempt} failed or stalled; retrying"
            sleep 5
          done
          echo "::error::playwright install failed after 3 bounded attempts"
          exit 1

      - name: Browser E2E
        run: npm run test:e2e

      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: playwright-report-${{ github.run_id }}
          path: dashboard/playwright-report/
          retention-days: 14
          if-no-files-found: ignore
      - run: npx tsc -b

  # ──────────────────────────────────────────────────────────────────────────
  # P0-8 (2026-08 audit): MEASUREMENT-ACCURACY BENCHMARK.
  # Everything else proves the code runs; this proves the code MEASURES. The
  # loopback is shaped with `tc netem` to a known delay + rate, and the
  # tester's reported RTT and throughput must land inside a tolerance band
  # around that ground truth. Before this job, nothing anywhere validated the
  # product's core claim.
  measurement-accuracy:
    name: Measurement accuracy (netem ground truth)
    runs-on: ${{ fromJSON(needs.changes.outputs.linux_bare_host) }}
    needs: [changes]
    if: needs.changes.outputs.rust == 'true'
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v5

      - uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # stable

      # GitHub-hosted only: a CI host keeps CARGO_HOME on local disk between
      # jobs (it is outside the workspace the loop wipes), so restoring the
      # same registry over a home uplink is pure cost. sccache covers the
      # compilation-unit cache there.
      - name: Cache cargo
        if: runner.environment == 'github-hosted'
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.1

      - name: Build tester + endpoint
        run: cargo build -p networker-tester -p networker-endpoint

      - name: Verify netem is available
        run: |
          sudo modprobe sch_netem || true
          tc qdisc show dev lo
          echo "tc present: $(tc -V)"

      - name: Run the accuracy benchmark against a shaped loopback
        run: sudo -E scripts/measurement-accuracy.sh

      - name: Upload the recorded baseline
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: measurement-accuracy-baseline
          path: benchmarks/baselines/measurement-accuracy.json
          if-no-files-found: warn

  # ──────────────────────────────────────────────────────────────────────────
  coverage:
    name: Coverage
    runs-on: ${{ fromJSON(needs.changes.outputs.linux_host) }}
    timeout-minutes: 30
    needs: [changes, test-ubuntu]  # only run if tests pass

    services:
      mssql:
        image: mcr.microsoft.com/mssql/server:2022-latest
        env:
          ACCEPT_EULA: "Y"
          SA_PASSWORD: "NetworkerTest1!"
        ports:
          - 1433:1433
        options: >-
          --health-cmd "/opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P NetworkerTest1! -C -Q 'SELECT 1'"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10

      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: network_diagnostics
          POSTGRES_USER: networker
          POSTGRES_PASSWORD: networker
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v5

      - uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # stable
        with:
          components: llvm-tools-preview

      - uses: taiki-e/install-action@39b03b784b1fb8d2e38e4d6dcf888b991e3c5898 # cargo-llvm-cov

      # GitHub-hosted only: a CI host keeps CARGO_HOME on local disk between
      # jobs (it is outside the workspace the loop wipes), so restoring the
      # same registry over a home uplink is pure cost. sccache covers the
      # compilation-unit cache there.
      - name: Cache cargo
        if: runner.environment == 'github-hosted'
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.1
        with:
          key: ubuntu-coverage
          cache-on-failure: "true"

      # Coverage for the shipped Rust crates (tester + endpoint); dashboard/agent
      # are C# now (their coverage lives in the dotnet suite).
      - name: Collect coverage (lib tests)
        run: |
          cargo llvm-cov --no-report -p networker-tester -p networker-endpoint --all-features --lib \
            -- --include-ignored
        env:
          NETWORKER_SQL_CONN: "Server=localhost;Database=NetworkDiagnostics;User Id=sa;Password=NetworkerTest1!;TrustServerCertificate=true"
          NETWORKER_DB_URL: "postgres://networker:networker@localhost/network_diagnostics"

      - name: Collect coverage (integration tests)
        run: |
          cargo llvm-cov --no-report -p networker-tester --all-features \
            --test integration

      - name: Generate lcov report
        run: |
          cargo llvm-cov report --lcov --output-path lcov.info \
            --ignore-filename-regex 'main\.rs'

      - name: Print coverage summary
        run: |
          cargo llvm-cov report --summary-only \
            --ignore-filename-regex 'main\.rs'

      - name: Generate HTML report
        run: |
          cargo llvm-cov report --html --output-dir coverage-html \
            --ignore-filename-regex 'main\.rs'

      - name: Upload coverage report
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: coverage-report
          path: |
            lcov.info
            coverage-html/
          # 1636 coverage artifacts had accumulated to 2 GB against a 0.5 GB
          # allowance. A coverage report is read within days of the run that
          # produced it, if at all.
          retention-days: 7

  # ──────────────────────────────────────────────────────────────────────────
  sql-integration:
    name: SQL Server integration
    runs-on: ${{ fromJSON(needs.changes.outputs.linux_host) }}
    needs: [changes, lint]
    timeout-minutes: 30

    services:
      mssql:
        image: mcr.microsoft.com/mssql/server:2022-latest
        env:
          ACCEPT_EULA: "Y"
          SA_PASSWORD: "NetworkerTest1!"
        ports:
          - 1433:1433
        options: >-
          --health-cmd "/opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P NetworkerTest1! -C -Q 'SELECT 1'"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v5
      - uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # stable

      # GitHub-hosted only: a CI host keeps CARGO_HOME on local disk between
      # jobs (it is outside the workspace the loop wipes), so restoring the
      # same registry over a home uplink is pure cost. sccache covers the
      # compilation-unit cache there.
      - name: Cache cargo
        if: runner.environment == 'github-hosted'
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.1
        with:
          key: sql-integration
          cache-on-failure: "true"

      - name: Run SQL tests
        env:
          NETWORKER_SQL_CONN: "Server=localhost;Database=master;User Id=sa;Password=NetworkerTest1!;TrustServerCertificate=true"
        run: cargo test -p networker-tester --no-default-features --features db-mssql db_mssql_ -- --ignored --test-threads=1

  # ──────────────────────────────────────────────────────────────────────────
  postgres-integration:
    name: PostgreSQL integration
    runs-on: ${{ fromJSON(needs.changes.outputs.linux_host) }}
    needs: [changes, lint]
    timeout-minutes: 20

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: network_diagnostics
          POSTGRES_USER: networker
          POSTGRES_PASSWORD: networker
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v5
      - uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # stable

      # GitHub-hosted only: a CI host keeps CARGO_HOME on local disk between
      # jobs (it is outside the workspace the loop wipes), so restoring the
      # same registry over a home uplink is pure cost. sccache covers the
      # compilation-unit cache there.
      - name: Cache cargo
        if: runner.environment == 'github-hosted'
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.1
        with:
          key: postgres-integration
          cache-on-failure: "true"

      - name: Run PostgreSQL tests
        env:
          NETWORKER_DB_URL: "postgres://networker:networker@localhost/network_diagnostics"
        run: cargo test -p networker-tester --no-default-features --features db-postgres db_postgres_ -- --ignored --test-threads=1

  # ──────────────────────────────────────────────────────────────────────────
  # Auto-tag: create version tag on merge → triggers Release + Deploy
  #
  # `needs: [changes]` ONLY. Until v0.28.267 this waited on lint/test-ubuntu/
  # frontend — a ~8 min duplicate of the matrix branch protection had already
  # required green on the PR, sitting squarely on the green-PR→prod path. The
  # main-branch matrix still runs (coverage, soak record); the tag just does
  # not queue behind it. In exchange the first step re-proves the merged PR
  # was green: it resolves the PR from the squash subject's `(#N)`, checks
  # that PR's head commit carries every branch-protection-required check
  # with conclusion success (or skipped — path-gated jobs skip legitimately),
  # and refuses to tag otherwise. A direct push to main (no `(#N)`) never
  # tags.
  # ──────────────────────────────────────────────────────────────────────────
  auto-tag:
    name: Auto-tag & deploy
    needs: [changes]
    runs-on: ${{ fromJSON(needs.changes.outputs.linux_host) }}
    timeout-minutes: 15
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v5
        with:
          fetch-depth: 0

      - name: Verify the merged PR's required checks were green
        env:
          GH_TOKEN: ${{ github.token }}
          # Keep in lock-step with branch protection (CLAUDE.md § Git Workflow).
          REQUIRED_CHECKS: |
            Test (ubuntu-latest)
            Test (windows-latest)
            Detect changed areas
            Build & audit (C#)
            bats (installer unit tests)
            shellcheck
            cargo audit (RUSTSEC advisories)
            Orchestrator lint & test
        run: |
          set -euo pipefail
          subject="$(git log -1 --format=%s "${GITHUB_SHA}")"
          echo "commit ${GITHUB_SHA}: ${subject}"
          pr="$(printf '%s\n' "${subject}" | sed -nE 's/.*\(#([0-9]+)\)$/\1/p')"
          if [ -z "${pr}" ]; then
            echo "::error::Commit ${GITHUB_SHA} is not a squash-merged PR (subject does not end with '(#N)') — refusing to tag a direct push to main. Open a PR instead."
            exit 1
          fi

          info="$(gh pr view "${pr}" --repo "${GITHUB_REPOSITORY}" --json headRefOid,mergedAt,state,mergeCommit)"
          state="$(jq -r '.state' <<<"${info}")"
          merged_at="$(jq -r '.mergedAt // empty' <<<"${info}")"
          head="$(jq -r '.headRefOid' <<<"${info}")"
          merge_sha="$(jq -r '.mergeCommit.oid // empty' <<<"${info}")"
          echo "PR #${pr}: state=${state} mergedAt=${merged_at:-<none>} head=${head} mergeCommit=${merge_sha:-<none>}"
          if [ "${state}" != "MERGED" ] || [ -z "${merged_at}" ]; then
            echo "::error::PR #${pr} (from the commit subject) is ${state}, not MERGED — refusing to tag."
            exit 1
          fi
          # The subject is free text; make sure #N really is THIS commit's PR
          # and not a number someone typed into a direct push.
          if [ -n "${merge_sha}" ] && [ "${merge_sha}" != "${GITHUB_SHA}" ]; then
            echo "::error::PR #${pr} merged as ${merge_sha}, but this push is ${GITHUB_SHA} — the subject's (#${pr}) does not belong to this commit. Refusing to tag."
            exit 1
          fi

          # Latest check-run per name on the PR head (re-runs create several
          # with the same name; the newest one is what branch protection saw).
          runs="$(gh api "repos/${GITHUB_REPOSITORY}/commits/${head}/check-runs?per_page=100" --paginate \
            --jq '.check_runs[] | {name, status, conclusion, started_at, html_url}' \
            | jq -s 'group_by(.name) | map(max_by(.started_at // ""))')"
          echo "check-runs on ${head}:"
          jq -r '.[] | "  \(.name)\t\(.status)\t\(.conclusion // "-")"' <<<"${runs}"

          failed=0
          while IFS= read -r name; do
            [ -n "${name}" ] || continue
            entry="$(jq -c --arg n "${name}" '.[] | select(.name == $n)' <<<"${runs}")"
            if [ -z "${entry}" ]; then
              echo "::error::Required check '${name}' never ran on PR #${pr} head ${head}."
              failed=1; continue
            fi
            status="$(jq -r '.status' <<<"${entry}")"
            conclusion="$(jq -r '.conclusion // "pending"' <<<"${entry}")"
            url="$(jq -r '.html_url // ""' <<<"${entry}")"
            case "${status}:${conclusion}" in
              completed:success|completed:skipped) echo "  ok   ${name} (${conclusion})" ;;
              *) echo "::error::Required check '${name}' on PR #${pr} head ${head} is ${status}/${conclusion}, not success/skipped — ${url}"; failed=1 ;;
            esac
          done <<<"${REQUIRED_CHECKS}"
          if [ "${failed}" != 0 ]; then
            echo "::error::Not tagging: PR #${pr} did not have every required check green on ${head}. Fix the PR's CI (or re-run the failed check) and push a new merge."
            exit 1
          fi
          echo "PR #${pr} head ${head}: every required check is green — proceeding to tag."

      - name: Check version and deploy
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VERSION=$(grep '^version' Cargo.toml | head -1 | sed 's/.*"\(.*\)"/\1/')
          TAG="v${VERSION}"
          echo "Cargo.toml version: ${VERSION}"

          # Tag push and release dispatch are SEPARATE API calls, so they can
          # half-succeed: on 2026-08-17 the tag v0.28.214 pushed and then
          # `gh workflow run` died on a GitHub 503 ("unable to determine default
          # branch"). The old guard keyed on "does the tag exist", so every rerun
          # then skipped straight past the missing release — v0.28.214 has a tag
          # and no release to this day. Key on the RELEASE instead: that makes a
          # stranded tag recoverable by simply re-running this job.
          # "Is there a release?" must distinguish a real 404 from an API blip:
          # treating a 503 as "no release" would re-dispatch a release that
          # already exists. Only a genuine not-found proceeds.
          release_state=""
          for attempt in 1 2 3; do
            out="$(gh release view "${TAG}" --json tagName 2>&1)" && { release_state="published"; break; }
            case "${out}" in
              *"release not found"*|*"Not Found"*|*"404"*) release_state="missing"; break ;;
              *) echo "release lookup attempt ${attempt} failed: ${out}"; sleep $((attempt * 10)) ;;
            esac
          done
          if [ "${release_state}" = "published" ]; then
            echo "Release ${TAG} already published — nothing to do"
            exit 0
          fi
          if [ "${release_state}" != "missing" ]; then
            echo "::error::Could not determine whether ${TAG} has a release (API unavailable) — refusing to guess."
            echo "::error::Re-run this job once the API recovers."
            exit 1
          fi

          if git tag -l "${TAG}" | grep -q "${TAG}"; then
            echo "Tag ${TAG} exists but has NO release — re-dispatching (recovery path)"
          else
            echo "New version detected — tagging ${TAG}"
            git tag "${TAG}"
            git push origin "${TAG}"
          fi

          # Retry the dispatch: a transient API failure here is what stranded
          # v0.28.214, and the release train is the last place to be optimistic.
          echo "Triggering Release workflow for ${TAG}..."
          for attempt in 1 2 3 4 5; do
            if gh workflow run release.yml --field tag="${TAG}"; then
              echo "Release workflow triggered for ${TAG} (attempt ${attempt})"
              exit 0
            fi
            echo "dispatch attempt ${attempt} failed — retrying in $((attempt * 15))s"
            sleep $((attempt * 15))
          done

          echo "::error::Tagged ${TAG} but could not trigger release.yml after 5 attempts."
          echo "::error::Recover with: gh workflow run release.yml --field tag=${TAG}"
          echo "::error::(or re-run this job — it now detects the missing release)"
          exit 1
