name: Prod run-execution canary

# Executes a REAL run end-to-end against prod and asserts the outcome the
# `Prod soak check` can't see. The soak check verifies /health + background
# loops but never runs anything — which is exactly how the run pipeline stayed
# silently broken for weeks (E2E pass 2026-07-28: P0-1 runs `failed` ~10ms after
# spawn; P0-2 attempts never persisted; P1-14 benchmarks never worked). This
# canary provisions an ephemeral runner, drives a probe run, asserts it reached
# `completed` with persisted + successful attempts, then (phase 2) provisions a
# rust endpoint behind nginx and runs apibench THROUGH the proxy, asserting the
# /api/* attempts return 2xx and zero proxy-404s (v0.28.112 shipped with /api
# absent from every proxy stack's allowlist → 404 on all attempts, invisible to
# a network probe) AND language authenticity — the deploy log must show the
# cell's reference-API install + /api reroute, or apibench silently measured
# the built-in endpoint /api (v0.28.114 class: languages written but dropped
# on the install path; returns 200s either way, so only the log can tell).
# Finally (phase 3) it reuses that same endpoint to run the full HTTP/TCP mode
# matrix through the proxy, asserting every mode returns a successful attempt
# (v0.28.118: pageload3/websocket were 0/N through nginx and reached prod
# unflagged) and that dispatch drops the unrunnable `native` mode (v0.28.120).
# Both the runner and the endpoint are torn down after.
#
# A red run = the run-execution path regressed. Alerting mirrors the soak check
# (a pinned issue, create-or-comment-or-close). Driven entirely through the
# public API — the only secret it needs is the admin password.
#
# See scripts/soak-canary.sh for the full logic + assertions.

on:
  schedule:
    - cron: '17 7 * * *'   # daily 07:17 UTC (30 min after the soak check)
    # Weekly MATRIX-FLOW run (audit P0-5): phases 1-3 all drive a single cell,
    # so the concurrent multi-cell path — where the whole v0.28.129-147
    # campaign's bugs lived (VM-name collisions, IP-quota exhaustion, relaunch
    # unique-name failures) — has never been exercised automatically. It
    # provisions several VMs at once, so it runs weekly rather than nightly.
    - cron: '17 8 * * 0'   # Sundays 08:17 UTC
  workflow_dispatch:
    inputs:
      reuse_runner:
        description: 'Reuse an existing idle runner instead of provisioning (1/0)'
        required: false
        default: '1'
      apibench:
        description: 'Also run the proxy-fronted apibench phase (1/0)'
        required: false
        default: '1'
      mode_coverage:
        description: 'Also run the full mode matrix through the proxy (1/0)'
        required: false
        default: '1'
      matrix_flow:
        description: 'Also run the multi-cell matrix flow phase — provisions ~3 VMs (1/0)'
        required: false
        default: '0'

permissions:
  contents: read
  issues: write   # failure alerting creates/comments the pinned issue

# Never overlap: an ephemeral runner + real run must finish before the next.
concurrency:
  group: soak-canary
  cancel-in-progress: false

jobs:
  canary:
    name: Run-execution canary
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Drive a real run end-to-end
        env:
          DASHBOARD_ADMIN_PASSWORD: ${{ secrets.DASHBOARD_ADMIN_PASSWORD }}
          CANARY_REUSE_RUNNER: ${{ github.event.inputs.reuse_runner || '1' }}
          CANARY_APIBENCH: ${{ github.event.inputs.apibench || '1' }}
          CANARY_MODE_COVERAGE: ${{ github.event.inputs.mode_coverage || '1' }}
          # Weekly cron (Sunday 08:17) turns the matrix phase on; the nightly
          # cron leaves it off. Manual runs use the input (default off).
          CANARY_MATRIX: ${{ github.event.inputs.matrix_flow || (github.event.schedule == '17 8 * * 0' && '1') || '0' }}
        run: bash scripts/soak-canary.sh

      # ── Failure alerting (mirrors the soak check's pinned-issue pattern) ──
      - name: Alert — open/update pinned issue
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          TITLE='Run-execution canary failing'
          RUN_URL="${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
          FAILED=$(gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}/jobs" \
            --jq '[.jobs[].steps[] | select(.conclusion=="failure") | .name] | join(", ")' 2>/dev/null || echo 'canary')
          {
            echo "The prod run-execution canary failed — a run did NOT complete end-to-end."
            echo ""
            echo "- Run: ${RUN_URL}"
            echo "- Failing step(s): ${FAILED}"
            echo ""
            echo "This asserts what /health cannot: a real run reaching \`completed\` with"
            echo "persisted + successful attempts (phase 1), AND a proxy-fronted apibench"
            echo "run whose /api/* attempts return 2xx with zero proxy-404s (phase 2). A"
            echo "failure means the run-execution path regressed (P0-1 stderr-relay-fails-runs"
            echo "/ P0-2 attempts-not-persisted / dispatch / provisioning) OR a proxy stack"
            echo "stopped forwarding /api/* to the backend (v0.28.112 class). See"
            echo "scripts/soak-canary.sh and docs/analysis/e2e-pass-2026-07-28.md."
          } > /tmp/canary-issue-body.md
          NUM=$(gh issue list --state open --json number,title \
            --jq "first(.[] | select(.title==\"${TITLE}\")).number // empty")
          if [ -z "$NUM" ]; then
            URL=$(gh issue create --title "$TITLE" --body-file /tmp/canary-issue-body.md)
            NUM="${URL##*/}"
            echo "Opened issue #${NUM}"
            gh issue pin "$NUM" || echo "::warning::could not pin issue #${NUM} (pin needs push-level rights; issue still open)"
          else
            gh issue comment "$NUM" --body-file /tmp/canary-issue-body.md
            echo "Commented on existing issue #${NUM}"
          fi

      # On the first green after a red streak: comment resolution, unpin, close.
      - name: Resolve alert issue on green
        if: success()
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          TITLE='Run-execution canary failing'
          RUN_URL="${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
          NUM=$(gh issue list --state open --json number,title \
            --jq "first(.[] | select(.title==\"${TITLE}\")).number // empty")
          if [ -z "$NUM" ]; then
            echo "No open canary-failure issue — nothing to resolve."
            exit 0
          fi
          gh issue unpin "$NUM" || echo "::warning::could not unpin issue #${NUM}"
          gh issue close "$NUM" --comment "Resolved — run-execution canary is green again: ${RUN_URL}."
          echo "Closed issue #${NUM}"
