# Every version tag should have a release behind it. Twice on 2026-08-17 one did
# not: `Auto-tag & deploy` pushes the tag and dispatches release.yml in two
# separate API calls, and a GitHub 503 between them strands the tag. v0.28.214
# was lost that way permanently; v0.28.217 hit the identical failure an hour
# after the recovery path shipped and was only caught because someone looked.
#
# This check looks, on a schedule, so a stranded tag surfaces by itself.
name: Release gap check

on:
  schedule:
    - cron: '31 7 * * *'   # daily 07:31 UTC — off-minute, clear of the soak/canary crons
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  gaps:
    name: tags without a release
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v5
        with:
          fetch-depth: 0

      - name: Compare tags against releases
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -uo pipefail

          # The API is exactly what fails in these incidents, so retry it rather
          # than reporting a phantom gap when GitHub is having a bad minute.
          releases=""
          for attempt in 1 2 3 4 5; do
            if releases="$(gh release list --limit 200 --json tagName --jq '.[].tagName' 2>&1)"; then
              break
            fi
            echo "release list attempt ${attempt} failed: ${releases}"
            releases=""
            sleep $((attempt * 10))
          done
          if [ -z "${releases}" ]; then
            echo "::error::Could not list releases after 5 attempts — not guessing. Re-run this job."
            exit 1
          fi

          version="$(grep '^version' Cargo.toml | head -1 | sed 's/.*"\(.*\)"/\1/')"
          current="v${version}"
          echo "main is at ${current}"

          # Only tags from the release ERA count. This repo carries 230-odd tags
          # from before it published releases at all (v0.1.0 … v0.27.x); listing
          # them as "gaps" buried the one line that matters under 230 warnings —
          # measured on the first real run, 2026-08-17. The floor is the OLDEST
          # published release, so this needs no maintenance as the repo ages.
          floor="$(printf '%s\n' "${releases}" | sed 's/^v//' | sort -V | head -1)"
          echo "release era starts at v${floor} (older tags are not gaps)"

          # `a <= b` by version order.
          ver_le() { [ "$(printf '%s\n%s\n' "$1" "$2" | sort -V | head -1)" = "$1" ]; }

          gaps=""
          skipped=0
          while read -r tag; do
            [ -n "${tag}" ] || continue
            bare="${tag#v}"
            if ! ver_le "${floor}" "${bare}"; then
              skipped=$((skipped + 1))
              continue
            fi
            if ! printf '%s\n' "${releases}" | grep -qxF "${tag}"; then
              gaps="${gaps} ${tag}"
            fi
          done <<< "$(git tag -l 'v*')"
          echo "${skipped} pre-release-era tag(s) ignored"

          # Shape 2: the version was merged but NEVER TAGGED — the auto-tag job
          # failed or was cancelled before it pushed the tag, so there is no tag
          # to compare and the loop above sees nothing. v0.28.210 is exactly this
          # (merged, no tag anywhere, no release) and it slipped past the first
          # version of this check. Only main's current version is worth asserting:
          # older untagged versions are unrecoverable history.
          if ! printf '%s\n' "${releases}" | grep -qxF "${current}" \
             && ! git tag -l "${current}" | grep -qxF "${current}"; then
            echo "::error::${current} is main's current version and has NEITHER a tag nor a release."
            echo "::error::The auto-tag job never got as far as pushing the tag. Recover by re-running 'Auto-tag & deploy' on main."
            actionable=1
          fi

          if [ -z "${gaps}" ] && [ "${actionable:-0}" = "0" ]; then
            echo "Every v* tag in the release era has a release."
            exit 0
          fi

          [ -n "${gaps}" ] && echo "Tags with no release:${gaps}"

          # Only the CURRENT version is safe to recover: re-running Auto-tag
          # dispatches release.yml, whose deploy job checks out the tag it is
          # given. Dispatching an OLD tag would roll production back to it, so
          # historical gaps are reported and deliberately left alone
          # (docs/release-flow.md §3).
          for tag in ${gaps}; do
            if [ "${tag}" = "${current}" ]; then
              echo "::error::${tag} is main's current version and has NO release."
              echo "::error::Recover by re-running the 'Auto-tag & deploy' job on main (it re-dispatches), or: gh workflow run release.yml --field tag=${tag}"
              actionable=1
            else
              echo "::warning::${tag} has no release. It is superseded, so LEAVE IT: dispatching release.yml for an old tag would deploy that version over production."
            fi
          done

          # An explicit `if`: GitHub runs steps with `bash -e`, so a trailing
          # `[ ... ] && exit 1` would fail the job on the FALSE branch too.
          if [ "${actionable:-0}" = "1" ]; then
            exit 1
          fi
          exit 0
