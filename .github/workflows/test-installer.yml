name: Installer Tests

# A newer push to the same PR cancels that PR's previous run: the self-hosted
# CI hosts are a small pool and a superseded run must not hold them (the
# first real day stacked eight workflows per push). Pushes to main and
# dispatches never cancel — auto-tag/release depend on them finishing.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

# Run on every push/PR that touches the installer or its tests.
#
# REQUIRED-CHECK COMPATIBLE: the pull_request trigger deliberately has NO
# `paths:` filter. A workflow-level path filter means non-matching PRs never
# create the check run at all, so a branch-protection required check would
# block those PRs forever ("Expected — waiting for status"). Instead, the
# workflow always starts on PRs and a cheap `changes` job decides whether the
# real jobs run; a job skipped via `if:` still reports a (passing) check run,
# which satisfies branch protection. Same pattern as ci.yml's `changes` job.
# The push trigger keeps its path filter — push events aren't gated by
# required checks, so skipping the whole workflow there is free.
on:
  push:
    branches: ["main", "develop"]
    paths:
      - "install.sh"
      - "install.ps1"
      - "tests/**"
      - ".github/workflows/test-installer.yml"
  pull_request:
    branches: ["main"]

permissions:
  contents: read

jobs:
  changes:
    name: Detect installer changes
    runs-on: ubuntu-latest
    outputs:
      installer: ${{ steps.detect.outputs.installer }}
      # Where the rest of this workflow runs (docs/self-hosted-ci.md).
      # This job itself stays on ubuntu-latest: it is the hop that decides.
      linux_host: ${{ steps.ci_hosts.outputs.linux }}
      windows_host: ${{ steps.ci_hosts.outputs.windows }}
      macos_host: ${{ steps.ci_hosts.outputs.macos }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v5
        with:
          fetch-depth: 0

      - name: Pick CI hosts (self-hosted when online, else GitHub-hosted)
        id: ci_hosts
        uses: ./.github/actions/pick-ci-hosts
        with:
          token: ${{ secrets.CI_HOSTS_STATUS_TOKEN }}
          mode: ${{ vars.CI_HOSTS_MODE }}

      - name: Detect
        id: detect
        run: |
          if [ "${{ github.event_name }}" != "pull_request" ]; then
            echo "installer=true" >> "$GITHUB_OUTPUT"
            echo "non-PR event — running installer tests"
            exit 0
          fi
          git fetch origin "${{ github.base_ref }}" --quiet
          # Version-bump-only edits to the five bump files are filtered out —
          # otherwise the mandatory per-PR bump makes every path filter true
          # and every PR pays for every suite (see scripts/ci/).
          CHANGED=$(scripts/ci/effective-changed-files.sh "origin/${{ github.base_ref }}")
          echo "changed files:"; echo "$CHANGED" | sed 's/^/  /'

          # Mirror the old workflow-level paths filter (tests/** includes the
          # bats suite + stubs). Avoid `grep -q` exit-code gymnastics: capture
          # matches and test non-empty.
          INSTALLER=false
          MATCHED=$(echo "$CHANGED" | grep -E '^(install\.sh$|install\.ps1$|tests/|\.github/workflows/test-installer\.yml$)' || true)
          if [ -n "$MATCHED" ]; then
            INSTALLER=true
            echo "installer-relevant files:"; echo "$MATCHED" | sed 's/^/  /'
          fi
          echo "installer=$INSTALLER" >> "$GITHUB_OUTPUT"
          echo "installer=$INSTALLER"

  # ── shellcheck: static analysis for install.sh ─────────────────────────────
  shellcheck:
    name: shellcheck
    needs: [changes]
    if: needs.changes.outputs.installer == 'true'
    runs-on: ${{ fromJSON(needs.changes.outputs.linux_host) }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v5

      - name: Install shellcheck
        run: sudo apt-get install -y shellcheck

      # Flags live in scripts/lint-all.sh (section shellcheck-installer):
      # SC2034 = unused vars (we use many globals as state); SC1091 = sourced
      # file not found (expected in CI); SC2154 = referenced but not assigned
      # (common with global state). Everything else is an error. The local
      # pre-push pass runs the identical command.
      - name: Lint install.sh
        run: scripts/lint-all.sh --ci --only shellcheck-installer

  # ── bats: unit tests for install.sh ────────────────────────────────────────
  bats:
    name: bats (installer unit tests)
    needs: [changes]
    if: needs.changes.outputs.installer == 'true'
    runs-on: ${{ fromJSON(needs.changes.outputs.linux_host) }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v5

      - name: Install bats-core
        run: |
          sudo apt-get install -y bats

      - name: Make stubs executable
        run: chmod +x tests/stubs/*

      - name: Run installer tests
        run: bats --tap tests/installer.bats

      # tests/integration/{aws,azure} drive REAL cloud VMs, so CI can't execute
      # them — but nothing referenced them either, so for five months they
      # could have stopped parsing and no one would know (audit P1-15). Counting
      # the tests loads and parses each file without running any of them, which
      # is the cheapest thing that turns silent rot into a red build.
      - name: Parse cloud integration suites (no execution)
        run: |
          set -euo pipefail
          total=0
          for f in tests/integration/*/*.bats; do
            n="$(bats --count "$f")"
            echo "  $f → $n test(s)"
            [ "$n" -gt 0 ] || { echo "::error file=$f::suite parses to 0 tests"; exit 1; }
            total=$((total + n))
          done
          echo "parsed $total cloud integration tests across $(ls tests/integration/*/*.bats | wc -l) suites"
          # These reference install.sh component names; a rename there silently
          # breaks every one of them. Fail here instead of on someone's laptop.
          grep -q 'endpoint)' install.sh
          grep -q 'tester)' install.sh

  # ── shellcheck on Windows installer (PowerShell syntax is checked by PSScriptAnalyzer) ──
  psscriptanalyzer:
    name: PSScriptAnalyzer (install.ps1)
    needs: [changes]
    if: needs.changes.outputs.installer == 'true'
    runs-on: ${{ fromJSON(needs.changes.outputs.windows_host) }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v5

      - name: Lint install.ps1
        shell: pwsh
        run: |
          Install-Module -Name PSScriptAnalyzer -Force -Scope CurrentUser -ErrorAction Stop
          $results = Invoke-ScriptAnalyzer -Path install.ps1 -Severity Warning,Error
          if ($results) {
            $results | Format-Table -AutoSize
            exit 1
          }
          Write-Host "PSScriptAnalyzer: no issues found."

      - name: Parse install.ps1 as Windows PowerShell 5.1 sees it (ANSI, no BOM)
        shell: pwsh
        run: |
          # The field failure this guards (2026-08-14): deployed VMs download
          # install.ps1 (UTF-8, no BOM) and run it under Windows PowerShell
          # 5.1, which reads BOM-less files as ANSI/cp1252 — a UTF-8 em dash
          # ends in byte 0x94, a cp1252 CURLY QUOTE, which the 5.1 parser
          # treats as a string delimiter. Strings terminate early, code leaks
          # out, the script dies at parse time — while pwsh-7 CI (UTF-8)
          # stays green. Tokenize the cp1252 view; any error is the exact
          # error a target VM would hit.
          $bytes = [IO.File]::ReadAllBytes('install.ps1')
          $ansi = [Text.Encoding]::GetEncoding(1252).GetString($bytes)
          $errs = $null
          [System.Management.Automation.PSParser]::Tokenize($ansi, [ref]$errs) | Out-Null
          if ($errs.Count) {
            Write-Host "::error::install.ps1 fails to parse under the 5.1/ANSI view (non-ASCII inside a string?)"
            $errs | Select-Object -First 5 | Format-List
            exit 1
          }
          Write-Host "cp1252-view tokenizes clean — safe for Windows PowerShell 5.1 targets."

  # ── P0-4 (2026-08 audit): EXECUTE the linux proxy-stack setups ─────────────
  # The bats suite drives functions and greps generated config text, but the
  # caddy and apache stacks shipped broken for weeks while those tests were
  # green (a config that never starts is textually indistinguishable from one
  # that does). This job runs `install.sh --setup-stack <stack>` for every
  # linux stack against a real networker-endpoint and asserts each proxy
  # actually SERVES: /health and /download round-trip THROUGH the proxy on
  # both its HTTP and HTTPS listeners.
  stack-exec:
    name: Linux stack execution (setup-stack + proxy round-trip)
    runs-on: ${{ fromJSON(needs.changes.outputs.linux_host) }}
    needs: [changes]
    if: needs.changes.outputs.installer == 'true'
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v5

      - name: Rust toolchain
        uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # stable

      - name: Build networker-endpoint
        run: cargo build -p networker-endpoint

      - name: Start endpoint on the proxy upstream ports
        run: |
          # The generated proxy configs upstream to 127.0.0.1:8080 (HTTP) and
          # 127.0.0.1:8443 (TLS). Install the binary where the setups'
          # generate-site step expects it, then boot it.
          sudo install -m 0755 target/debug/networker-endpoint /usr/local/bin/networker-endpoint
          nohup /usr/local/bin/networker-endpoint \
            --http-port 8080 --https-port 8443 \
            --udp-port 9999 --udp-throughput-port 9998 \
            > /tmp/endpoint.log 2>&1 &
          for i in $(seq 1 30); do
            curl -sf http://127.0.0.1:8080/health && break
            sleep 1
          done
          curl -sf http://127.0.0.1:8080/health >/dev/null
          echo "endpoint healthy"

      - name: Run every linux stack setup and round-trip through each proxy
        run: |
          set -u
          declare -a STACKS=("nginx:8081:8444" "caddy:8091:8454" "traefik:8092:8455" "haproxy:8093:8456" "apache:8094:8457")
          FAILED=0
          for entry in "${STACKS[@]}"; do
            stack="${entry%%:*}"; rest="${entry#*:}"
            http_port="${rest%%:*}"; https_port="${rest#*:}"
            echo "::group::--setup-stack ${stack}"
            if ! sudo -E bash install.sh --setup-stack "$stack" < /dev/null; then
              echo "::error::${stack}: setup exited non-zero"
              FAILED=1; echo "::endgroup::"; continue
            fi
            sleep 2
            ok=1
            for probe in \
              "http://127.0.0.1:${http_port}/health" \
              "https://127.0.0.1:${https_port}/health" \
              "https://127.0.0.1:${https_port}/download/4096"; do
              if curl -skf --max-time 10 "$probe" -o /dev/null; then
                echo "OK  ${stack}: ${probe}"
              else
                echo "::error::${stack}: ${probe} did not serve"
                ok=0
              fi
            done
            if [ "$ok" = "0" ]; then
              FAILED=1
              echo "--- ${stack} service state ---"
              systemctl --no-pager status "networker-${stack}" nginx apache2 2>/dev/null | head -30 || true
            fi
            echo "::endgroup::"
          done
          exit $FAILED

  # ── #801 pattern A coverage: the two Linux language-install paths that ─────
  # failed in the field with zero CI execution: a framework-dependent .NET
  # publish on a runner whose system SDK set may not include the channel
  # (csharp-net9 — exercises the --list-sdks channel gate and the
  # DOTNET_ROOT-pinned apphost launch), and a Native AOT publish
  # (csharp-net9-aot — exercises the clang/zlib prerequisites + ILCompiler).
  linux-bench-exec:
    name: Linux reference-API execution (net9 + net9-aot)
    runs-on: ${{ fromJSON(needs.changes.outputs.linux_host) }}
    needs: [changes]
    if: needs.changes.outputs.installer == 'true'
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v5

      - name: Deploy csharp-net9 (framework-dependent) and assert health
        run: |
          sudo -E bash install.sh --benchmark-server csharp-net9 --benchmark-port 8085 < /dev/null
          curl -sf http://127.0.0.1:8085/health | grep -q '"runtime":"csharp-net9"'
          curl -sf 'http://127.0.0.1:8085/api/users?limit=2' -o /dev/null
          echo "csharp-net9 healthy on :8085"

      - name: Deploy csharp-net9-aot (Native AOT) and assert health
        run: |
          sudo -E bash install.sh --benchmark-server csharp-net9-aot --benchmark-port 8086 < /dev/null
          curl -sf http://127.0.0.1:8086/health | grep -q '"runtime":"csharp-net9-aot"'
          curl -sf 'http://127.0.0.1:8086/api/users?limit=2' -o /dev/null
          echo "csharp-net9-aot healthy on :8086"

  # ── P0-3 (2026-08 audit): EXECUTE the Windows installer + proxy stacks ─────
  # install.ps1 had ZERO automated execution — PSScriptAnalyzer is lint-only —
  # while every Windows proxy stack was asserted by grepping install.sh. That
  # is how an em-dash (which broke the generated IIS script at PARSE time) and
  # a never-working Caddy shipped repeatedly. This job runs the orphaned
  # 161-assertion unit script AND actually installs the Windows stacks that
  # can run on a GitHub runner, asserting each serves.
  windows-exec:
    name: Windows installer execution (unit script + stack setup)
    runs-on: ${{ fromJSON(needs.changes.outputs.windows_host) }}
    needs: [changes]
    if: needs.changes.outputs.installer == 'true'
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v5

      - name: Run the install.ps1 unit suite (161 assertions, previously wired to nothing)
        shell: pwsh
        run: pwsh -File tests/test_install_ps1.ps1

      - name: Rust toolchain
        uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # stable

      - name: Build + start networker-endpoint (proxy upstream)
        shell: pwsh
        run: |
          cargo build -p networker-endpoint
          New-Item -ItemType Directory -Force C:\networker | Out-Null
          Copy-Item target\debug\networker-endpoint.exe C:\networker\networker-endpoint.exe
          Start-Process -FilePath C:\networker\networker-endpoint.exe `
            -ArgumentList '--http-port','8080','--https-port','8443','--udp-port','9999','--udp-throughput-port','9998' `
            -WindowStyle Hidden
          $ok = $false
          foreach ($i in 1..30) {
            try { Invoke-WebRequest -Uri http://127.0.0.1:8080/health -UseBasicParsing -TimeoutSec 3 | Out-Null; $ok = $true; break }
            catch { Start-Sleep -Seconds 1 }
          }
          if (-not $ok) { throw "endpoint did not become healthy" }
          Write-Host "endpoint healthy"

      - name: Setup Caddy + Traefik and assert they serve through the proxy
        shell: pwsh
        run: |
          # IIS is excluded here: the runner image's IIS feature install +
          # reboot-for-HTTP/3 path doesn't fit a hosted runner. Caddy and
          # Traefik are the two Windows stacks the matrix actually provisions
          # via install.ps1 -Setup, and both were broken-but-green before.
          $failed = $false
          foreach ($case in @(
              @{ Stack = 'caddy';   Http = 8091; Https = 8454 },
              @{ Stack = 'traefik'; Http = 8092; Https = 8455 })) {
            Write-Host "::group::-Setup $($case.Stack)"
            try {
              & .\install.ps1 -Setup $case.Stack
            } catch {
              Write-Host "::error::$($case.Stack): setup threw — $($_.Exception.Message)"
              # Dump what the wrapped process actually said — nssm's
              # SERVICE_PAUSED means "started then exited", and the reason is
              # only in the stack's own stderr/config.
              $sd = Join-Path $env:ProgramData "networker\$($case.Stack)"
              Get-ChildItem $sd -ErrorAction SilentlyContinue | ForEach-Object { Write-Host "  file: $($_.Name) ($($_.Length)b)" }
              foreach ($log in @("$sd\$($case.Stack)-stderr.log", "$sd\$($case.Stack)-stdout.log")) {
                if (Test-Path $log) { Write-Host "--- $log"; Get-Content $log -Tail 20 | ForEach-Object { Write-Host "    $_" } }
              }
              if ($case.Stack -eq 'traefik') {
                foreach ($cfg in @("$sd\traefik.yml", "$sd\dynamic.yml")) {
                  if (Test-Path $cfg) { Write-Host "--- $cfg"; Get-Content $cfg | ForEach-Object { Write-Host "    $_" } }
                }
                & "$sd\traefik.exe" --configfile "$sd\traefik.yml" 2>&1 | Select-Object -First 15 | ForEach-Object { Write-Host "    run: $_" }
              }
              $failed = $true; Write-Host "::endgroup::"; continue
            }
            Start-Sleep -Seconds 3
            # HTTP only: the stacks serve a SELF-SIGNED cert by design, and
            # -SkipCertificateCheck is unreliable across the PS editions on
            # the runner image (it failed a working caddy on the first run of
            # this job). The HTTPS listener is covered by the linux job's
            # curl -k and by the prod canary; here we assert the process is
            # alive and proxying.
            foreach ($url in @("http://127.0.0.1:$($case.Http)/health")) {
              try {
                $r = Invoke-WebRequest -Uri $url -UseBasicParsing -TimeoutSec 10
                Write-Host "OK  $($case.Stack): $url -> $($r.StatusCode)"
              } catch {
                Write-Host "::error::$($case.Stack): $url did not serve — $($_.Exception.Message)"
                $failed = $true
              }
            }
            Write-Host "::endgroup::"
          }
          if ($failed) { throw "one or more Windows stacks failed to serve" }
      - name: Deploy Windows reference APIs and assert /api measures the language
        shell: pwsh
        run: |
          # v0.28.204: install.ps1 -BenchmarkServer on the two ends of the
          # Windows-viable set — go (fast, preinstalled) and csharp-net48
          # (the flagship: .NET Framework, csc.exe in-box). Each must come up
          # healthy on :8085 AND retarget the endpoint's /api at itself
          # (--api-upstream, asserted via the endpoint's own /health
          # self-report + an end-to-end /api round-trip).
          $env:NETWORKER_BENCH_REPO_DIR = $PWD.Path
          $failed = $false
          foreach ($lang in @('go', 'csharp-net48')) {
            Write-Host "::group::-BenchmarkServer $lang"
            & .\install.ps1 -BenchmarkServer $lang
            if ($LASTEXITCODE -ne 0) { Write-Host "::error::$lang setup failed"; $failed = $true; Write-Host "::endgroup::"; continue }
            $h = (Invoke-WebRequest -Uri http://127.0.0.1:8080/health -UseBasicParsing -TimeoutSec 5).Content | ConvertFrom-Json
            if ($h.services.api_upstream -ne '127.0.0.1:8085') {
              Write-Host "::error::endpoint does not report api_upstream after $lang"; $failed = $true
            }
            $lh = (Invoke-WebRequest -Uri http://127.0.0.1:8085/health -UseBasicParsing -TimeoutSec 5).Content | ConvertFrom-Json
            Write-Host "language runtime: $($lh.runtime)"
            $api = Invoke-WebRequest -Uri 'http://127.0.0.1:8080/api/users?limit=2' -UseBasicParsing -TimeoutSec 10
            if ($api.StatusCode -ne 200) {
              Write-Host "::error::/api through the endpoint did not reach $lang (HTTP $($api.StatusCode))"; $failed = $true
            } else {
              Write-Host "/api round-trip through the endpoint reached $lang"
            }
            Write-Host "::endgroup::"
          }
          if ($failed) { exit 1 }

