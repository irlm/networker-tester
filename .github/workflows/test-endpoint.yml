name: Endpoint Tests

# A newer push to the same PR cancels that PR's previous run: the self-hosted
# CI hosts are a small pool and a superseded run must not hold them (the
# first real day stacked eight workflows per push). Pushes to main and
# dispatches never cancel — auto-tag/release depend on them finishing.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

# Run on every push/PR that touches the endpoint crate or its bats tests.
on:
  push:
    branches: ["main", "develop"]
    paths:
      - "crates/networker-endpoint/**"
      - "benchmarks/reference-apis/**"
      - "benchmarks/validate/**"
      - "tests/endpoint.bats"
      - ".github/workflows/test-endpoint.yml"
  pull_request:
    branches: ["main"]
    paths:
      - "crates/networker-endpoint/**"
      - "benchmarks/reference-apis/**"
      - "benchmarks/validate/**"
      - "tests/endpoint.bats"
      - ".github/workflows/test-endpoint.yml"

permissions:
  contents: read

jobs:
  # ── CI host selection (docs/self-hosted-ci.md) ────────────────────────
  # Stays on ubuntu-latest (~10 hosted seconds): it is the hop that decides
  # whether every other job below lands on the repo's self-hosted CI hosts
  # (when one is online) or on GitHub-hosted ones. No `if:` — a skipped
  # picker would skip everything that needs it.
  ci_hosts:
    name: Pick CI hosts
    runs-on: ubuntu-latest
    outputs:
      linux_host: ${{ steps.ci_hosts.outputs.linux }}
      windows_host: ${{ steps.ci_hosts.outputs.windows }}
      macos_host: ${{ steps.ci_hosts.outputs.macos }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v5
      - name: Pick CI hosts (self-hosted when online, else GitHub-hosted)
        id: ci_hosts
        uses: ./.github/actions/pick-ci-hosts
        with:
          token: ${{ secrets.CI_HOSTS_STATUS_TOKEN }}
          mode: ${{ vars.CI_HOSTS_MODE }}

  # ── Rust unit tests (fast, no binary needed) ────────────────────────────────
  cargo-test:
    name: cargo test (networker-endpoint)
    runs-on: ${{ fromJSON(needs.ci_hosts.outputs.linux_host) }}
    needs: [ci_hosts]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v5

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # stable

      - name: Cache cargo registry
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v5
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-endpoint-${{ hashFiles('Cargo.lock') }}
          restore-keys: ${{ runner.os }}-cargo-endpoint-

      - name: Run unit tests
        run: cargo test -p networker-endpoint

  # ── bats integration tests (builds binary, tests via curl) ──────────────────
  bats:
    name: bats (endpoint integration)
    runs-on: ${{ fromJSON(needs.ci_hosts.outputs.linux_host) }}
    needs: [ci_hosts]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v5

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # stable

      - name: Cache cargo registry
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v5
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-endpoint-${{ hashFiles('Cargo.lock') }}
          restore-keys: ${{ runner.os }}-cargo-endpoint-

      - name: Build networker-endpoint
        run: cargo build -p networker-endpoint

      - name: Install bats-core
        run: sudo apt-get install -y bats

      - name: Run endpoint integration tests
        run: bats --tap tests/endpoint.bats

  # ── JSON API validation (starts endpoint, tests all benchmark API endpoints) ─
  json-api-validation:
    name: JSON API validation (Rust endpoint)
    runs-on: ${{ fromJSON(needs.ci_hosts.outputs.linux_host) }}
    needs: [ci_hosts]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v5

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # stable

      - name: Cache cargo registry
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v5
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-endpoint-${{ hashFiles('Cargo.lock') }}
          restore-keys: ${{ runner.os }}-cargo-endpoint-

      - name: Run JSON API validation (Rust endpoint)
        run: ./benchmarks/validate/run-validation.sh --rust-only
