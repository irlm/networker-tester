# A containerised networker CI host plus its own Docker daemon.
#
#   docker compose -f infra/ci-hosts/container/compose.yml up -d --build
#
# Reads infra/ci-hosts/container/.env (see .env.example). The PAT is a mounted
# file, never an environment variable and never a layer.
#
# What this does NOT do, deliberately:
#   * publish any port — the runner only makes OUTBOUND connections, so it
#     cannot collide with whatever the machine already serves;
#   * mount /var/run/docker.sock — jobs get the `dind` daemon instead, so the
#     loop's between-jobs `docker rm -f` sweep can never see the machine's own
#     containers and images.
name: networker-ci-host

services:
  dind:
    # The CI jobs' Docker daemon. Private to this compose project.
    image: docker:29-dind
    privileged: true            # unavoidable for a nested daemon
    environment:
      DOCKER_TLS_CERTDIR: ""    # plain TCP on an internal-only network
    command: ["--host=tcp://0.0.0.0:2375", "--host=unix:///var/run/docker.sock"]
    networks: [ci]
    volumes:
      - dind-storage:/var/lib/docker
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "docker", "info"]
      interval: 5s
      timeout: 5s
      retries: 30

  ci-host:
    build:
      context: ../../..
      dockerfile: infra/ci-hosts/container/Dockerfile
    image: networker-ci-host:latest
    depends_on:
      dind:
        condition: service_healthy
    environment:
      CI_HOST_REPO: ${CI_HOST_REPO:?set CI_HOST_REPO=OWNER/REPO in .env}
      CI_HOST_NAME: ${CI_HOST_NAME:-ci-container-1}
      CI_HOST_LABELS: ${CI_HOST_LABELS:-self-hosted,linux,networker-ci}
      CI_HOST_RUNNER_GROUP: ${CI_HOST_RUNNER_GROUP:-}
      DOCKER_HOST: tcp://dind:2375
    volumes:
      # The PAT: root-owned, 0600, read-only. Docker Engine (not Swarm) has no
      # real secrets, so this is a bind mount rather than a `secrets:` entry.
      - ${CI_HOST_TOKEN_FILE:?set CI_HOST_TOKEN_FILE to the PAT file}:/run/secrets/ci-host-token:ro
      - ci-cache:/var/cache/ci-host
      - ci-work:/opt/actions-runner/_work
    networks: [ci]
    restart: unless-stopped
    # A job may build a large workspace; keep the container from being the
    # thing that runs the machine out of memory.
    mem_limit: ${CI_HOST_MEM_LIMIT:-24g}
    cpus: ${CI_HOST_CPUS:-10}

networks:
  ci:
    # internal: false — the runner must reach api.github.com and the jobs must
    # reach crates.io / nuget / npm. It is a private bridge, not a published
    # surface: no service in this project publishes a port.
    driver: bridge

volumes:
  dind-storage:   # the jobs' image/layer cache — survives a restart
  ci-cache:       # sccache / nuget / npm / playwright, the point of a persistent host
  ci-work:        # _work: keeps _tool and _actions across jobs, like a VM host
