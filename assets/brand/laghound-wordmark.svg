<svg xmlns="http://www.w3.org/2000/svg" width="300" height="72" viewBox="0 0 300 72" fill="none" role="img" aria-label="LagHound">
  <title>LagHound</title>
  <!-- Glyph (scaled from the 64px master): prompt + latency trace + cursor -->
  <g transform="translate(8 8) scale(0.875)">
    <rect x="1.5" y="1.5" width="61" height="61" rx="14" fill="#0d0e14" stroke="#1a1b25" stroke-width="1.5"/>
    <polyline points="12,24 20,32 12,40" fill="none" stroke="#863bff" stroke-width="3.4"
              stroke-linecap="round" stroke-linejoin="round"/>
    <polyline points="25,38 30,38 34,29 38,45 42,29 46,38" fill="none" stroke="#47bfff"
              stroke-width="2.8" stroke-linecap="round" stroke-linejoin="round"/>
    <rect x="50" y="30.5" width="4.6" height="15" rx="1.3" fill="#863bff"/>
  </g>
  <!-- Wordmark. Purple is the brand wordmark colour; the cyan cursor is the
       terminal accent. system-ui keeps it crisp wherever a browser renders it. -->
  <text x="80" y="47" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif"
        font-size="34" font-weight="700" letter-spacing="-0.5" fill="#863bff">LagHound<tspan fill="#47bfff" font-weight="600">_</tspan></text>
</svg>
