notes = "Reviewed delta: removed SpawnBlockingError re-export (breaking, unused here), dropped num_cpus/lazy_static deps, MSRV 1.85/edition 2024, itertools 0.15. No unsafe additions."

[[audits.deadpool-postgres]]
who = "Igor L Marques <igor.marques@gmail.com>"
