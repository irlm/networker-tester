notes = "Reviewed delta: coalesces concurrent PREPARE statements, MSRV 1.85, tokio-postgres 0.7.14, deadpool 0.13.1. Beneficial; no security concerns."

[[audits.deadpool-runtime]]
who = "Igor L Marques <igor.marques@gmail.com>"
criteria = "safe-to-deploy"
delta = "0.1.4 -> 0.3.1"
notes = "Reviewed delta: Runtime enum methods became functions + non_exhaustive (breaking, transitive/unused here), smol 2.0, SpawnBlockingError::Cancelled. No unsafe."

[[audits.flate2]]
who = "Igor L Marques <igor.marques@gmail.com>"
criteria = "safe-to-deploy"
delta = "1.1.9 -> 1.1.10"
notes = "Reviewed delta: security hardening (fixes gzip header/footer infinite loop, rejects oversized extra fields and incomplete deflate streams), drops cloudflare-zlib, bumps miniz_oxide to 0.9."

[[audits.hyper]]
who = "Igor L Marques <igor.marques@gmail.com>"
criteria = "safe-to-deploy"
delta = "1.11.0 -> 1.11.1"
notes = "Reviewed delta: four HTTP/1 bug fixes (TE trailers case-insensitive, head terminator recognition, write-buffer flush, connection-pool eviction on Connection: close). No breaking/security regressions."

[[audits.maxminddb]]
who = "Igor L Marques <igor.marques@gmail.com>"
criteria = "safe-to-deploy"
delta = "0.30.0 -> 0.30.3"
notes = "Reviewed delta: robustness fixes returning InvalidDatabase instead of panicking on malformed/overflowing extended types (upstream #122). No API break."

[[audits.miniz_oxide]]
